name: sync

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
    inputs:
      examples_branch:
        default: main
        description: |
          The branch of the examples repository to sync from.
          Default: main
      docs_branch:
        default: main
        description: |
          The base branch in docs repository to create PR against.
          Default: main

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.docs_branch || 'main' }}
        token: ${{ secrets.GH_PAT }}

    - name: Sync example READMEs
      shell: bash
      env:
        EXAMPLES_BRANCH: ${{ inputs.examples_branch || 'main' }}
      run: |
        make sync

    - name: Show diff
      shell: bash
      run: |
        git diff pages/guides/

    - name: Generate branch ID
      id: id
      run: |
        BRANCH="sync/examples-$(date +'%Y%m%d%H%M%S')"
        echo "name=${BRANCH}" >>"${GITHUB_OUTPUT}"

    - name: Generate timestamp
      id: timestamp
      run: |
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "value=${TIMESTAMP}" >>"${GITHUB_OUTPUT}"

    - name: Create pull request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_PAT }}
        base: ${{ inputs.docs_branch || 'main' }}
        commit-message: "chore: Update guides from examples repository"
        title: "chore: Update guides from examples repository"
        body: |
          IMPORTANT: Please make sure to review the deployment of this PR and also update `zudoku.config.tsx` and `pages/guides/overview.mdx` if necessary.

          Automated sync of example READMEs from [`unikraft-cloud/examples@${{ inputs.examples_branch || 'main' }}`](https://github.com/unikraft-cloud/examples/tree/${{ inputs.examples_branch || 'main' }}).

          This PR updates the guides in `pages/guides/` with the latest content from the examples repository.

          **Branch:** `${{ inputs.examples_branch || 'main' }}`
          **Timestamp:** ${{ steps.timestamp.outputs.value }}
        branch: ${{ steps.id.outputs.name }}
        committer: Unikraft Bot <monkey@unikraft.io>
        author: Unikraft Bot <monkey@unikraft.io>
        add-paths: pages/guides
        signoff: true
        labels: |
          automated
          sync
          documentation
