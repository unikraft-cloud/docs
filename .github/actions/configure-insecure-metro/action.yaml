name: configure-insecure-metro

description: |
  Sets insecure: true for CI metros and ensures the profile has just one metro ($UKC_METRO_NAME).

runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'
      cache: 'pip'
      cache-dependency-path: requirements.txt

  - name: Install Python dependencies
    shell: bash
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Configure metro
    shell: bash
    run: |
      python3 - <<'PY'
      import yaml, os, sys

      metro_name = os.environ.get('UKC_METRO_NAME', '').strip()
      if not metro_name:
          print('Missing UKC_METRO_NAME variable', file=sys.stderr)
          sys.exit(1)

      config_path = os.path.expanduser('~/.config/unikraft/config.yaml')
      with open(config_path) as f:
          config = yaml.safe_load(f)

      for name, profile in (config.get('profiles') or {}).items():
          metros = [m for m in profile.get('metros') or [] if m.get('name') == metro_name]
          if not metros:
              print(f'No {metro_name} metro in profile {name}', file=sys.stderr)
              sys.exit(1)

          for metro in metros:
              metro['insecure'] = True

          profile['metros'] = metros

      with open(config_path, 'w') as f:
          yaml.safe_dump(config, f, default_flow_style=False)
      PY
