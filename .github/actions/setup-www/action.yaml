name: setup-www

description: |
  Deploys the Unikraft landing and docs website (www).

inputs:
  environment:
    required: true
    description: The environment to use.
  name:
    required: true
    description: Name of the service.
  domain:
    required: false
    description: The domain to use for the deployment.
  metro:
    required: false
    description: Unikraft Cloud Metro.
    default: dal2
  memory:
    required: false
    description: Set the memory size.
    default: 1GiB
  port:
    required: false
    description: The port the service listens on.
    default: "2015"
  log-level:
    required: false
    default: error
    description: Set the logging level.
  posthog-host:
    required: false
    description: The host address for the PostHog API.
  posthog-key:
    required: false
    description: The key to authenticate with PostHog.
  channel:
    required: false
    default: staging
    description: |
      The branch/channel of dependency repos (openapi, x) to pull when
      building the site. One of `staging` or `stable`.

outputs:
  domain:
    description: |
      Either the input domain if set or the automatically generated value
      otherwise.
    value: ${{ steps.service.outputs.domain }}

runs:
  using: composite
  steps:
  - name: Create Deployment
    uses: bobheadxi/deployments@v1
    id: init-deploy
    with:
      step: start
      token: ${{ github.token }}
      env: ${{ inputs.environment }}

  - name: Create Service Group
    id: service
    shell: bash
    run: |
      set -e;

      # Create the service if it does not exist.
      if [[ $(unikraft services list --filter "name==${{ inputs.name }},metro==${{ inputs.metro }}" -o raw | jq 'length') -ne 1 ]]; then
        if [[ "${{ inputs.domain }}" == "" ]]; then
          unikraft services create --metro "${{ inputs.metro }}" \
            --domain "${{ inputs.name }}" \
            --name "${{ inputs.name }}" \
            --service "443:${{ inputs.port }}/http+tls" \
          ;
        else
          unikraft services create --metro "${{ inputs.metro }}" \
            --domain "${{ inputs.domain }}" \
            --name "${{ inputs.name }}" \
            --service "443:${{ inputs.port }}/http+tls" \
          ;
        fi
      fi

      # Save the generated domain as an output variable
      echo "domain=$(unikraft services list --filter metro==${{ inputs.metro }},name==${{ inputs.name }} -o raw | jq -r '.[0].domains[0].fqdn')" >> $GITHUB_OUTPUT

  - name: Deploy
    id: deploy
    shell: bash
    run: |
      set -e;

      # Remember what's currently serving so we can retire them after rollout
      OLD=$(unikraft instances list \
        --filter "service.name==${{ inputs.name }},metro==${{ inputs.metro }}" \
        -o json | jq -r '.[].name');

      unikraft build . \
        --output "internal/${{ inputs.name }}:latest" \
        --build-arg API_URL="https://${{ steps.service.outputs.domain }}" \
        --build-arg PUBLIC_API_URL="https://${{ steps.service.outputs.domain }}" \
        --build-arg VITE_PUBLIC_SITE_URL="https://${{ steps.service.outputs.domain }}" \
        --build-arg PUBLIC_STATUS_PAGE_SUMMARY_URL="https://status.unikraft.cloud/api/v1/summary" \
        --build-arg PUBLIC_POSTHOG_HOST="${{ inputs.posthog-host }}" \
        --build-arg PUBLIC_POSTHOG_KEY="${{ inputs.posthog-key }}" \
        --build-arg CHANNEL="${{ inputs.channel }}";

      NEW=$(unikraft run \
        --metro "${{ inputs.metro }}" \
        -m "${{ inputs.memory }}" \
        --service "${{ inputs.name }}" \
        --image "internal/${{ inputs.name }}:latest" \
        -o json | jq -r '.[].name');

      echo "instance=$NEW" >> $GITHUB_OUTPUT;

      # Wait for the new instance to be running, then retire the old ones
      unikraft instances wait "$NEW" --until state==running;

      if [ -n "$OLD" ]; then
        unikraft instances delete $OLD;
      fi

  - name: Test liveliness
    id: liveliness
    continue-on-error: true
    shell: bash
    run: |
      sleep 10;
      curl -Lk --fail "https://${{ steps.service.outputs.domain }}/"

  - name: Dump instance logs on failure
    if: ${{ steps.liveliness.outcome == 'failure' }}
    shell: bash
    run: |
      unikraft instances logs "${{ steps.deploy.outputs.instance }}"
      exit 1

  - name: Update Deployment
    uses: bobheadxi/deployments@v1
    with:
      step: finish
      token: ${{ github.token }}
      env: ${{ inputs.environment }}
      deployment_id: ${{ steps.init-deploy.outputs.deployment_id }}
      status: ${{ job.status }}
